<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Product Review Sentiment Analyzer" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a class="brand" href="{{ url_for('home') }}">ReviewPulse Commerce</a>
            <div class="nav-links">
                <a class="{{ 'active' if request.endpoint == 'home' else '' }}" href="{{ url_for('home') }}">Home</a>
                <a class="{{ 'active' if request.endpoint == 'analyze' else '' }}" href="{{ url_for('analyze') }}">Analyze</a>
                <a class="{{ 'active' if request.endpoint == 'reviews' else '' }}" href="{{ url_for('reviews') }}">Reviews</a>
                <a class="{{ 'active' if request.endpoint == 'about' else '' }}" href="{{ url_for('about') }}">About</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 ReviewPulse Commerce. Product Review Sentiment Analyzer.</p>
    </footer>
</body>
</html>
