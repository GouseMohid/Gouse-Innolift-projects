{% extends "layout.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex justify-between items-end mb-8">
        <div>
            <h1 class="text-4xl font-bold mb-2">Reviews Dataset</h1>
            <p class="text-gray-400">Manage and explore processed customer feedback.</p>
        </div>
        <div class="hidden sm:block">
            <input type="text" placeholder="Search reviews..." class="bg-black/20 border border-white/10 rounded-lg px-4 py-2 text-sm focus:ring-1 focus:ring-cyan-500 focus:border-cyan-500 text-white w-64 shadow-inner">
        </div>
    </div>

    <div class="glass rounded-xl overflow-hidden shadow-2xl border border-white/10">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-black/40 border-b border-white/10 text-xs uppercase tracking-wider text-gray-400">
                        <th class="p-4">ID</th>
                        <th class="p-4">Review Text</th>
                        <th class="p-4">Sentiment</th>
                        <th class="p-4 text-right">Confidence</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                    {% for row in reviews %}
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-4 text-gray-400">#{{ row.id }}</td>
                        <td class="p-4 text-gray-200 max-w-lg truncate" title="{{ row.text }}">{{ row.text }}</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-xs font-bold 
                                {% if row.sentiment == 'Positive' %} bg-success/20 text-success border border-success/30
                                {% elif row.sentiment == 'Negative' %} bg-negative/20 text-negative border border-negative/30
                                {% else %} bg-yellow-400/20 text-yellow-400 border border-yellow-400/30 {% endif %}">
                                {{ row.sentiment }}
                            </span>
                        </td>
                        <td class="p-4 text-right text-sm">
                            <div class="flex items-center justify-end gap-2">
                                <span>{{ row.confidence }}%</span>
                            </div>
                        </td>
                    </tr>
{% endfor %}


                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
